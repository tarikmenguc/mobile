name: mobile
description: "Kalori Lens Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Utilities
  cupertino_icons: 1.0.6
  intl: 0.19.0
  get: 4.6.6
  get_storage: 2.1.1
  
  # Network
  dio: 5.4.0
  
  # Features (Pinned to Stable/Compatible Versions)
  image_picker: ^1.0.7
  file_picker: ^8.1.4
  fl_chart: ^0.66.0
  mobile_scanner: ^6.0.0 
  permission_handler: ^11.3.0
  google_fonts: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 2.0.3

flutter:
  uses-material-design: true
